<!DOCTYPE html>
<html>
<head>
    <title>GrowBox Control</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #84f9a3; }
        h1 { text-shadow: -2px 0px 2px #000000;color: #8c42e1; }
        h2{ color: #000000; 
            -webkit-text-stroke-width: 0.5px;
            -webkit-text-stroke-color: #8c42e1;
            font-size: 30px;
            font-family: sans-serif;
        }
        .text-stoke {
            font-size: 75px;
            
            color: #aa09f4;
            font-family: sans-serif;
            text-align: center;
            letter-spacing: 5px;
        }   
        .box { background: #f2f963; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .auto { background-color: #6309f4; color: white; }
        .man { background-color: #c0392b; color: white; }
    </style>
</head>
<body>
    <center>
                <div class="text-stoke">
                <h1><strong>Bienvenidos al GrowBox Control</strong></h1>
                </div>
                <div class="box">
                    <center><h2><strong> ELEGIR MODALIDAD</strong></h2></center>
                    <center><a href="http://google.com"> 
                        <button class="btn auto" onclick="toggle('modalidad', 'automatica')">Automatica</button>
                    </a> 
                    <a href="http://ansa.it"> 
                        <button class="btn man" onclick="toggle('modalidad', 'manual')">Manual</button>
                    </a> 
                    </center>
                </div>
</center>
</body>
</html>
