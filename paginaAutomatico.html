<!DOCTYPE html>
<html>
<head>
    <title>Modalidad Automatica</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #84f9a3; }
        h1 { text-shadow: -2px 0px 2px #000000;color: #8c42e1; }
        h2{ color: #000000; 
            -webkit-text-stroke-width: 0.5px;
            -webkit-text-stroke-color: #8c42e1;
            font-size: 30px;
            font-family: sans-serif;
        }
        .text-stoke {
            font-size: 75px;
            color: #aa09f4;
            font-family: sans-serif;
            text-align: center;
            letter-spacing: 5px;
        }   
        .box { background: #f2f963; padding: 15px; border-radius: 10px; width: 60%; }
        .btn { padding: 10px 20px; margin: 20px; font-size: 16px; }
        .auto { background-color: #6309f4; color: white; }
        .man { background-color: #c0392b; color: white; }
    </style>
</head>
<body>
    <center>
        
                    <div class="text-stoke">
                    <h1><strong>MODALIDAD AUTOMATICA</strong></h1>
                    </div>
         <div class="box">

                        <img src="plantula.png" alt="Plantula" style="width: 120px; height: auto;">
                      <img src="veg.png" alt="Vegetativo" style="width: 120px; height: auto;">
                      <img src="flora.png" alt="Floracion" style="width: 120px; height: auto;">
                        <img src="UV.png" alt="Luz UV" style="width: 120px; height: auto;">
                    </div>
                    <div class="box">
                        <center><h2><strong>Elegir el ciclo de cultivo</strong></h2></center>
                        <button class="btn man" onclick="toggle('ciclo', 'Plantula')">Plantula </button>
                        <button class="btn man" onclick="toggle('ciclo', 'Vegetativo')">Vegetativo</button>
                        <button class="btn man" onclick="toggle('ciclo', 'Floracion')">Floracion</button>
                        <button class="btn man" onclick="toggle('ciclo', 'Luz UV')">Luz UV</button>
                                        </div>
                           

                        <div class="box">
                            <center><h2><strong>Elegir el numero de semanas</strong></h2></center>
                            <button class="btn auto" onclick="toggle('semanas', '1')">1</button>
                            <button class="btn auto" onclick="toggle('semanas', '2')">2</button>
                            <button class="btn auto" onclick="toggle('semanas', '3')">3</button>
                            <button class="btn auto" onclick="toggle('semanas', '4')">4</button>
                            <button class="btn auto" onclick="toggle('semanas', '5')">5</button>
                            <button class="btn auto" onclick="toggle('semanas', '6')">6</button>
                            <button class="btn auto" onclick="toggle('semanas', '7')">7</button>
                            <button class="btn auto" onclick="toggle('semanas', '8')">8</button>
                    </div>
                    <a href="paginaIniziale.html">
                    <button class="btn man">HOME</button>
                </a>
                </div>
                
    </center>
    </body>
    </html>
