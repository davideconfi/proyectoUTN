<!DOCTYPE html>
<html>
<head>
    <title>Modalidad Automatica</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #84f9a3; }
        h1 { text-shadow: -2px 0px 2px #000000;color: #8c42e1; }
        h2{ color: #000000; 
            -webkit-text-stroke-width: 0.5px;
            -webkit-text-stroke-color: #8c42e1;
            font-size: 20px;
            font-family: sans-serif;
        }
        .text-stoke {
            font-size: 75px;
            color: #aa09f4;
            font-family: sans-serif;
            text-align: center;
            letter-spacing: 5px;
        }   
        .box { background: #f2f963; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .auto { background-color: #6309f4; color: white; }
        .man { background-color: #c0392b; color: white; }
        #mi_imagen{
                    width: 100%;
                }
    </style>
</head>
<body>
    <center> 
    <div class="text-stoke">
    <h1><strong>MODALIDAD MANUAL</strong></h1>
    </div>
        <div class="box">
            <center><h2><strong>Elegir la intensidad de cada tipo de led</strong></h2></center>
        </div>
            <div class="box">
                <h2>LED1</h2>
                <input type="range" id="ledSlider" min="0" max="1023" value="0" oninput="updateLED(this.value)">
                <span id="led1Value">0</span>
            </div>
            <div class="box">
                <h2>LED2</h2>
                <input type="range" id="ledSlider" min="0" max="1023" value="0" oninput="updateLED(this.value)">
                <span id="led2Value">0</span>
            </div>
            <div class="box">
                <h2>LED3</h2>
                <input type="range" id="ledSlider" min="0" max="1023" value="0" oninput="updateLED(this.value)">
                <span id="led3Value">0</span>
            </div>
            <div class="box">
                <h2>LED4</h2>
                <input type="range" id="ledSlider" min="0" max="1023" value="0" oninput="updateLED(this.value)">
                <span id="led4Value">0</span>
            </div>
            <div class="box">
                <h2>LED5</h2>
                <input type="range" id="ledSlider" min="0" max="1023" value="0" oninput="updateLED(this.value)">
                <span id="led5Value">0</span>
            </div>
                <div class="box">
                    <center><h3  >Ventilador</h3> </center>               
                    <img id= mi_imagen src="fan ON.jpg"style="width: 100%;">
                    <button class="btn on" onclick="toggle('ventola', 'on')">Accendi</button>
                    <button class="btn off" onclick="toggle('ventola', 'off')">Spegni</button>
                </div>
                <div class="box">
                    <h2>Extractor</h2>
                    <button class="btn on" onclick="toggle('estrattore', 'on')">Accendi</button>
                    <button class="btn off" onclick="toggle('estrattore', 'off')">Spegni</button>
                </div>
                <div class="box">
                    <h2>Riego</h2>
                    <button class="btn on" onclick="toggle('pompa', 'on')">Accendi</button>
                    <button class="btn off" onclick="toggle('pompa', 'off')">Spegni</button>
                </div>
                <div class="box">
                    <a href="paginaIniziale.html">
                    <button class="btn on">HOME</button>
                </a>
                </div>
                    
                        
                    
                    <script>
                        function toggle(comando, stato) {
                            fetch(`/${comando}?stato=${stato}`);
                        }
                    
                        function updateLED(val) {
                            document.getElementById("ledValue").innerText = val;
                            fetch(`/led?val=${val}`);
                        }
                    </script>
    </center>
    </body>
    </html>
